# ─────────────────────────────────────────────────────────────────────────────
# Dokploy → Compose: ТОЛЬКО фронтенд (otakuum.ru). Деплоится отдельно от CMS.
#
#   Provider:      GitHub, тот же репозиторий, ветка master
#   Compose Path:  ./apps/web/docker-compose.yml
#   Watch Paths:   apps/web/**        (пуш в apps/cms не пересобирает сайт)
#   Environment:   apps/web/dokploy.env.example
#   Domains:       Host otakuum.ru (+ www), Service Name web, Port 3000, HTTPS
#
# Порядок первой выкладки: сначала CMS, потом web (сайт запрашивает поля CMS).
# Тот же результат даёт сервис Application (см. /DEPLOY.md).
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # вшиваются в образ при сборке (клиентский бандл и images.remotePatterns)
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://otakuum.ru}
        NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-https://cms.otakuum.ru/api/graphql}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3.otakuum.ru/media}
        S3_INTERNAL_URL: ${S3_INTERNAL_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Адрес GraphQL для серверных запросов (SSR). По умолчанию — публичный.
      # Быстрее и без выхода в интернет — внутренний адрес CMS в dokploy-network:
      #   GRAPHQL_API_URL=http://movhub-cms:3000/api/graphql
      GRAPHQL_API_URL: ${GRAPHQL_API_URL:-${NEXT_PUBLIC_GRAPHQL_API_URL:-https://cms.otakuum.ru/api/graphql}}
      # Только если задан S3_INTERNAL_URL при сборке: подмена публичного адреса
      # картинок на внутренний для серверных запросов (см. src/lib/api.ts).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3.otakuum.ru/media}
      S3_INTERNAL_URL: ${S3_INTERNAL_URL:-}
      # Секрет для POST /api/revalidate. Должен совпадать с REVALIDATE_SECRET CMS.
      # Пусто — роут отключён (503).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      dokploy-network:
        aliases:
          # Уникальное имя в общей сети: имя `web` легко пересечётся с чужим
          # сервисом, и DNS будет отдавать то один контейнер, то другой.
          # CMS ходит сюда по REVALIDATE_URL=http://movhub-web:3000
          - movhub-web

networks:
  dokploy-network:
    external: true
