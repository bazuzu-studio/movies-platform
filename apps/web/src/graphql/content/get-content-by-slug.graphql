# src/graphql/contents/GetContentBySlug.graphql
# Сезоны и серии здесь НЕ запрашиваются: getContentBySlug (src/lib/api.ts)
# берёт их отдельным запросом GetSeriesFranchise сразу по всей франшизе.
# pagination: false — без лишнего COUNT(*) для выборки одной записи.
query GetContentBySlug($slug: String!) {
  Contents(where: { slug: { equals: $slug } }, limit: 1, pagination: false) {
    docs {
      id
      type
      titleEn
      titleRu
      originalTitle
      slug
      description
      releaseYear
      kinopoiskId
      franchiseId
      duration
      rating

      poster {
        url
      }
      backdrop {
        url
      }
      genres {
        id
        title
        slug
      }
      ageRating
      releaseStatus
      playerLink

      # SEO-плагин CMS (@payloadcms/plugin-seo): заполняется пайплайном/редакторами
      meta {
        title
        description
        image {
          url
        }
      }
    }
  }
}
