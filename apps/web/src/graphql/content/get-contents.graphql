# Карточки каталога/главной. Только то, что рисует MovieCard: без backdrop и
# жанров (это лишние JOIN'ы на каждую из 50 записей страницы).
query GetContent($limit: Int, $page: Int, $sort: String, $where: Content_where) {
  Contents(limit: $limit, page: $page, sort: $sort, where: $where) {
    docs {
      id
      titleEn
      titleRu
      slug
      type
      releaseYear
      rating
      poster {
        url
      }
      ageRating
      releaseStatus
    }
    totalDocs
    hasNextPage
  }
}
