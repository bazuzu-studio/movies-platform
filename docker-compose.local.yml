services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movhub}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecretpassword}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_local_data:/data
    # ИСПРАВЛЕНИЕ 1: Использование встроенного в SILO хелсчека
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: docker.io/pgsty/silo:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecretpassword}
      S3_BUCKET: ${S3_BUCKET:-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "Waiting for MinIO to be fully ready..."
        for i in $(seq 1 30); do
          mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break
          echo "MinIO not ready yet (attempt $$i/30), retrying in 2s..."
          sleep 2
        done
        mcli mb --ignore-existing "local/$$S3_BUCKET"
        # ИСПРАВЛЕНО: Новый синтаксис для установки публичного доступа (Read-Only)
        mcli policy set download "local/$$S3_BUCKET"

volumes:
  postgres_local_data:
  minio_local_data:
