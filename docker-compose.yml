services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies2}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-movies2}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app


  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app


  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    ports:
      # S3 API
      - "${MINIO_API_PORT:-9000}:9000"

      # MinIO Console
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app


  # MinIO Client:
  # автоматически создаёт bucket и делает его доступным для чтения.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000
      ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
      mc mb --ignore-existing minio/${S3_BUCKET:-media};
      mc anonymous set download minio/${S3_BUCKET:-media};
      exit 0;
      "

    networks:
      - app


volumes:
  postgres_data:
    name: postgres_data

  redis_data:
    name: redis_data

  minio_data:
    name: minio_data


networks:
  app:
    name: movies_app
    driver: bridge